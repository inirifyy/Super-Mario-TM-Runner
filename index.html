<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario TM Runner</title>
  <!-- Google Fonts: Pixel Art 8-bit -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- p5.js & ml5.js CDN -->

      <h1>SUPER MARIO TM</h1>
      <p class="subtitle">TEACHABLE MACHINE RUNNER</p>

    <div class="url-input-box">
      <label for="modelUrl">MODEL URL:</label>

      <button id="loadModelBtn" onclick="loadUserModel()">LOAD</button>
    </div>

    <div class="canvas-container" id="canvas-holder">
      <!-- Canvas p5.js dimasukkan otomatis ke sini -->
    </div>

      <div class="card">👇 <span>DUCK</span></div>
